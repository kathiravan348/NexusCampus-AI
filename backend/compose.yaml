# NexusCampus local services (dev only). Ports bind to 127.0.0.1; every service has a memory limit (AGENTS §5a).
# Start: uv run --project backend nexus-compose-up   ·   Stop: docker compose -f backend/compose.yaml down
# Passwords come from backend/.env (git-ignored); copy backend/.env.example first.
name: nexuscampus

services:
  db:
    # PostgreSQL 16 with pgvector (D47). Pinned by tag here; images are pinned by digest for installs (NEX-064).
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${NEXUS_DB_PASSWORD:?set NEXUS_DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nexus-db:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb"]
    ports:
      - "127.0.0.1:56379:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    # Identity (D44). Dev mode with its own file database; the realm is imported on first start and demo users
    # are added by `uv run --project backend nexus-keycloak-dev` (passwords only from backend/.env).
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${NEXUS_KEYCLOAK_ADMIN_PASSWORD:?set NEXUS_KEYCLOAK_ADMIN_PASSWORD in backend/.env}
      NEXUS_OIDC_CLIENT_SECRET: ${NEXUS_OIDC_CLIENT_SECRET:?set NEXUS_OIDC_CLIENT_SECRET in backend/.env}
      KC_HOSTNAME: http://127.0.0.1:58080
    ports:
      - "127.0.0.1:58080:8080"
    volumes:
      - ./keycloak/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro
    mem_limit: 1g
    healthcheck:
      # The image has no curl: ask the management port with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

  vault:
    # Keys and secrets (D46). DEV MODE ONLY: in-memory, unsealed, root token from backend/.env. Production runs
    # Vault (or OpenBao) in HA with auto-unseal (NEX-064 docs).
    image: hashicorp/vault:1.20.4
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${NEXUS_VAULT_TOKEN:?set NEXUS_VAULT_TOKEN in backend/.env}
      SKIP_SETCAP: "true"
    ports:
      - "127.0.0.1:58200:8200"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  nexus-db:
