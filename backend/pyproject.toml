[project]
name = "nexus-backend"
version = "0.1.0"
description = "NexusCampus product backend (modular monolith, FastAPI)"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.165.0",
    "httpx2==2.16.2",
    "opentelemetry-api==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-sdk==1.45.2",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pyjwt[crypto]==2.15.1",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn==0.54.0",
]

[project.scripts]
nexus-dev = "nexus.devtools.dev:main"
nexus-compose-up = "nexus.devtools.compose:main"
backend-check = "nexus.devtools.check:main"
nexus-seed = "nexus.seed.demo:main"
nexus-keycloak-dev = "nexus.devtools.keycloak:main"
nexus-scim-token = "nexus.devtools.scim_token:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.uv]
add-bounds = "exact"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/nexus/devtools/*" = ["S603", "S607"]
# DDL cannot bind parameters; migrations build it from constants (and one quoted password).
"migrations/*" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]
