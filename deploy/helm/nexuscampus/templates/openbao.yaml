{{- if .Values.openbao.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexuscampus.fullname" . }}-openbao-config
  labels:
    {{- include "nexuscampus.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
data:
  vault.hcl: |
    storage "raft" {
      path    = "/openbao/file"
      node_id = "nexus-1"
    }
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = "true"
    }
    disable_mlock = true
    ui            = false
    api_addr      = "http://{{ include "nexuscampus.fullname" . }}-openbao:8200"
    cluster_addr  = "http://{{ include "nexuscampus.fullname" . }}-openbao:8201"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nexuscampus.fullname" . }}-openbao
  labels:
    {{- include "nexuscampus.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  serviceName: {{ include "nexuscampus.fullname" . }}-openbao
  replicas: 1
  selector:
    matchLabels:
      {{- include "nexuscampus.selectorLabels" (merge (dict "component" "openbao") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexuscampus.labels" . | nindent 8 }}
        {{- include "nexuscampus.selectorLabels" (merge (dict "component" "openbao") .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: {{ include "nexuscampus.image" .Values.images.openbao | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - bao
            - server
            - -config=/openbao/config/vault.hcl
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
          ports:
            - name: http
              containerPort: 8200
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "bao status >/dev/null 2>&1; [ $? -ne 1 ]"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "bao status >/dev/null 2>&1; [ $? -ne 1 ]"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.openbao.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /openbao/config/vault.hcl
              subPath: vault.hcl
              readOnly: true
            - name: data
              mountPath: /openbao/file
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "nexuscampus.fullname" . }}-openbao-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.openbao.storageClassName }}
        storageClassName: {{ .Values.openbao.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.openbao.storageSize | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexuscampus.fullname" . }}-openbao
  labels:
    {{- include "nexuscampus.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  type: ClusterIP
  selector:
    {{- include "nexuscampus.selectorLabels" (merge (dict "component" "openbao") .) | nindent 4 }}
  ports:
    - name: http
      port: 8200
      targetPort: http
      protocol: TCP
{{- end }}
