{{- if .Values.valkey.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nexuscampus.fullname" . }}-valkey
  labels:
    {{- include "nexuscampus.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  serviceName: {{ include "nexuscampus.fullname" . }}-valkey
  replicas: 1
  selector:
    matchLabels:
      {{- include "nexuscampus.selectorLabels" (merge (dict "component" "valkey") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexuscampus.labels" . | nindent 8 }}
        {{- include "nexuscampus.selectorLabels" (merge (dict "component" "valkey") .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ include "nexuscampus.image" .Values.images.valkey | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - valkey-server
            - --save
            - "60"
            - "100"
            - --appendonly
            - "no"
            - --maxmemory
            - 96mb
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.valkey.storageClassName }}
        storageClassName: {{ .Values.valkey.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.valkey.storageSize | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexuscampus.fullname" . }}-valkey
  labels:
    {{- include "nexuscampus.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  selector:
    {{- include "nexuscampus.selectorLabels" (merge (dict "component" "valkey") .) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- end }}
